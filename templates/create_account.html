<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LodoPlayers - Create Account</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/create_account.css') }}">
</head>

<body>

    <div class="signup-container">

        <div class="logo-section">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="LodoPlayers Logo">
        </div>

      

    <form class="signup-form" method="POST" action="{{ url_for('create_account') }}">

        <p class="input-title">Create your account</p>

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <input type="tel"
               name="phonenumber"
               placeholder="Phone Number"
               required>

        <button type="submit" class="submit-btn">
    Submit
</button>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <p class="success-message">{{ message }}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

    </form>
 

<button type="button"
        class="back-login-btn"
        onclick="window.location.href='{{ url_for('login') }}'">

    <span class="back-icon">&#8592;</span>

</button>

</div>


 


<script>

setTimeout(function(){

    const message = document.querySelector(".success-message");

    if(message){
        message.style.display = "none";
    }

},5000);

</script>
</body>
</html>
