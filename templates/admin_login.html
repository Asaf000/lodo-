<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

</head>

<body>

    <h1>
        Admin Login
    </h1>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% for category, message in messages %}

            <p>
                {{ message }}
            </p>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('admin.admin_login') }}"
    >

        <input
            type="text"
            name="username"
            placeholder="Admin Username"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <button
            type="submit"
        >
            Login
        </button>

    </form>

</body>

</html>
